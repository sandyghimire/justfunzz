<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>Just for you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0b2e;--bg2:#3a1450;--rose:#ff6f91;--gold:#ffd27a;--ink:#fff4f8;--glass:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,var(--bg2),var(--bg1) 70%);overflow-x:hidden}
canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.page{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transform:scale(.94) translateY(30px);transition:all .8s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.page.active{opacity:1;visibility:visible;transform:none}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.15}
h1{font-size:clamp(2.2rem,7vw,4rem)}
h2{font-size:clamp(1.6rem,5vw,2.6rem);max-width:640px;margin:18px 0 22px;min-height:2.4em}
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:28px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.photo{width:170px;height:170px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 8px rgba(255,210,122,.15),0 0 40px rgba(255,111,145,.6);animation:float 4s ease-in-out infinite;background:linear-gradient(135deg,var(--rose),var(--gold))}
.photo.sq{border-radius:22px;width:min(260px,70vw);height:auto;max-height:260px}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
.opts{display:grid;gap:12px;margin-top:6px}
.opt,button.go{font:600 1.05rem 'Nunito',sans-serif;color:var(--ink);padding:14px 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);cursor:pointer;transition:.25s}
.opt:hover{background:rgba(255,111,145,.35);transform:scale(1.03)}
.opt.sel{background:linear-gradient(90deg,var(--rose),#ff9a6f);border-color:transparent;transform:scale(1.04);box-shadow:0 0 25px rgba(255,111,145,.7)}
button.go{background:linear-gradient(90deg,var(--rose),#ff9a6f);border:none;margin-top:20px;animation:pulse 1.8s infinite}
button.go:disabled{opacity:.35;animation:none;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,111,145,0)}0%{box-shadow:0 0 0 0 rgba(255,111,145,.6)}}
input[type=text],textarea{width:100%;font:1.05rem 'Nunito',sans-serif;color:var(--ink);background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);border-radius:18px;padding:14px 18px;outline:none}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,122,.4)}
.bar{position:fixed;top:0;left:0;height:5px;z-index:5;background:linear-gradient(90deg,var(--rose),var(--gold));width:0;transition:width .8s}
.step{font-size:.95rem;opacity:.7;margin-top:14px}
.sub{opacity:.85;max-width:460px;margin-top:14px;line-height:1.6}
.cursor::after{content:'|';animation:blink 1s infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.sheet{position:relative;max-width:560px;width:100%;text-align:left}
.sheet img.agree{width:100%;border-radius:14px;border:2px solid var(--gold);margin-bottom:14px;background:rgba(255,255,255,.1);min-height:60px}
.ans{padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.25)}
.ans small{display:block;opacity:.65;font-size:.82rem}
.ans b{color:var(--gold);font-size:1.1rem}
.shot{margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(90deg,var(--rose),#ff9a6f);font-weight:600;text-align:center;animation:pulse 1.8s infinite}
.mini{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.mini img{width:70px;height:70px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:linear-gradient(135deg,var(--rose),var(--gold))}
.final{max-width:560px;width:100%}
.final .big{font-size:4rem;animation:float 2.5s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* ===== Mobile friendly ===== */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
.page{height:100dvh;justify-content:flex-start;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.page>:first-child{margin-top:auto}
.page>:last-child{margin-bottom:auto}
input[type=text],textarea{font-size:16px}
.opt,button.go{min-height:48px;width:100%;max-width:560px}
.opts{width:100%}
@media (max-width:480px){
  .photo{width:120px;height:120px;border-width:3px}
  .photo.sq{width:min(200px,58vw);max-height:200px}
  h2{margin:12px 0 14px;min-height:0}
  .card{padding:18px;border-radius:22px}
  .opt{font-size:1rem;padding:12px 16px}
  .sub{font-size:.95rem;margin-top:10px}
  .mini img{width:54px;height:54px}
  .final .big{font-size:3rem}
  .shot{font-size:.95rem;padding:14px}
}
@media (max-height:640px){.photo{width:90px;height:90px}.photo.sq{max-height:140px;width:min(150px,45vw)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="bar" id="bar"></div>

<!-- PAGE 1 -->
<section class="page active" id="p1">
  <img class="photo" data-img="her" alt="">
  <h2 id="t1"></h2>
  <div class="card"><input type="text" id="a1" placeholder="Type your answer here..." autocomplete="off"></div>
  <button class="go" disabled>Next</button>
  <p class="step">Question 1 of 5</p>
</section>

<!-- PAGE 2 -->
<section class="page" id="p2">
  <img class="photo sq" data-img="agreement" alt="">
  <h2 id="t2"></h2>
  <div class="card"><div class="opts" id="o2"></div></div>
  <button class="go" disabled>Next</button>
  <p class="step">Question 2 of 5</p>
</section>

<!-- PAGE 3 -->
<section class="page" id="p3">
  <h2 id="t3"></h2>
  <div class="card"><div class="opts" id="o3"></div></div>
  <button class="go" disabled>Next</button>
  <p class="step">Question 3 of 5</p>
</section>

<!-- PAGE 4 -->
<section class="page" id="p4">
  <h2 id="t4"></h2>
  <div class="card"><textarea id="a4" rows="3" placeholder="Write whatever your heart says..."></textarea></div>
  <button class="go" disabled>Next</button>
  <p class="step">Question 4 of 5</p>
</section>

<!-- PAGE 5 -->
<section class="page" id="p5">
  <h2 id="t5"></h2>
  <div class="card"><div class="opts" id="o5"></div></div>
  <button class="go" disabled>See my answers</button>
  <p class="step">Question 5 of 5</p>
</section>

<!-- PAGE 6 -->
<section class="page" id="p6">
  <div class="final">
    <h1 id="fh"></h1>
    <div class="sheet card" style="margin-top:18px">
      <div id="summary"></div>
      <div class="shot">📸 Take a screenshot of this page and send it to <span id="him"></span> 💌</div>
    </div>
  </div>
</section>

<!-- REVEAL PAGE (shows right after "What should I call you?") -->
<section class="page" id="pr">
  <h1 id="rh"></h1>
  <p class="sub" id="rs"></p>
  <div class="card" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:16px">
    <p class="sub" style="margin:0">Let's keep going, the next questions are for you 😉</p>
  </div>
  <button class="go" id="rbtn">Continue</button>
</section>

<script>
/* ====== EDIT THESE ====== */
const HER  = "Beautiful";   // her name
const HIM  = "me";
// Photo file names WITHOUT extension (.jpg .jpeg .png .webp are tried automatically)
const PHOTO_HER = "her";
const PHOTO_AGREEMENT = "agreement";          // your name (shown in the last message)
const Q = [
  {q:"Hey "+HER+"... before anything, what should I call you?", type:"text", label:"Your name"},
  {q:"Pick the plan that sounds like the perfect evening.", type:"choice", label:"Perfect evening",
    opts:["Long drive with music 🚗","Street food and endless talking 🍜","Movie night with blankets 🎬","Sunset walk somewhere quiet 🌅"]},
  {q:"What made you smile the most this month?", type:"choice", label:"Made me smile",
    opts:["A random memory 😊","A message from someone 📱","Good food 🍰","Honestly, I can't pick one ✨"]},
  {q:"Describe your ideal person in one line.", type:"text", area:true, label:"My ideal person"},
  {q:"Last one: will you say yes to a coffee with me?", type:"choice", label:"Coffee with me",
    opts:["Yes, absolutely ☕","Yes, but you're paying 😄","Maybe, convince me 😏"]}
];
const FINAL_TITLE = "Your answers are in ✨";
/* ======================== */

const ans=[];let cur=1;
const pages=[...document.querySelectorAll('.page')];
const bar=document.getElementById('bar');

function type(el,text,i=0){ if(i===0){el.textContent='';el.classList.add('cursor')}
  if(i<text.length){el.textContent+=text[i];setTimeout(()=>type(el,text,i+1),35)} else el.classList.remove('cursor')}

function show(n){
  pages.forEach((p,i)=>p.classList.toggle('active',i===n-1));
  cur=n;bar.style.width=((n-1)/5*100)+'%';
  if(n<=5) setTimeout(()=>type(document.getElementById('t'+n),Q[n-1].q),500);
  if(n===6) finish();
  burst();
}

// Build each question page
Q.forEach((item,i)=>{
  const n=i+1,page=document.getElementById('p'+n),btn=page.querySelector('.go');
  if(item.type==='choice'){
    const box=document.getElementById('o'+n);
    item.opts.forEach(o=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ans[i]=o;btn.disabled=false;burst(.4)};
      box.appendChild(b);
    });
  }else{
    const inp=page.querySelector('input,textarea');
    inp.addEventListener('input',()=>{ans[i]=inp.value.trim();btn.disabled=!ans[i]});
  }
  btn.onclick=()=> n===1 ? reveal() : show(n+1);
});

function reveal(){
  pages.forEach(p=>p.classList.toggle('active',p.id==='pr'));
  bar.style.width='10%';
  document.getElementById('rh').textContent='Nice to meet you, '+ans[0]+' 💖';
  document.getElementById('rs').textContent='This page is made only for you.';
  burst(2);
}
document.getElementById('rbtn').onclick=()=>show(2);

function finish(){
  document.getElementById('fh').textContent=FINAL_TITLE;
  document.getElementById('him').textContent=HIM;
  document.getElementById('summary').innerHTML=Q.map((x,i)=>
    `<div class="ans"><small>${x.label}</small><b></b></div>`).join('');
  document.querySelectorAll('#summary b').forEach((b,i)=>b.textContent=ans[i]);
  setTimeout(()=>burst(3),400);
}

/* ===== Floating hearts + confetti ===== */
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,parts=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight}size();addEventListener('resize',size);
const em=['💖','💗','✨','🌸','💫','❤️'];
function add(fast){parts.push({x:Math.random()*W,y:fast?H*.6:H+20,vx:(Math.random()-.5)*(fast?8:1),vy:-(Math.random()*(fast?9:1.6)+.6),s:Math.random()*18+12,e:em[Math.floor(Math.random()*em.length)],life:fast?90:9999,r:Math.random()*6})}
function burst(k=1){for(let i=0;i<40*k;i++)add(true)}
for(let i=0;i<22;i++){add();parts[i].y=Math.random()*H}
(function loop(){
  x.clearRect(0,0,W,H);
  if(Math.random()<.06)add();
  parts=parts.filter(p=>p.y>-40&&p.life>0);
  parts.forEach(p=>{p.x+=p.vx+Math.sin(p.y/40)*.4;p.y+=p.vy;p.life--;if(p.life<30)x.globalAlpha=Math.max(p.life/30,0);else x.globalAlpha=.75;
    x.font=p.s+'px serif';x.fillText(p.e,p.x,p.y);if(p.life<9999)p.vy+=.08});
  x.globalAlpha=1;requestAnimationFrame(loop);
})();


/* ===== Photo loader: tries several extensions automatically ===== */
const EXTS=['jpg','jpeg','png','webp','JPG','JPEG','PNG','WEBP'];
function loadPhoto(img){
  const base=img.dataset.img==='her'?PHOTO_HER:PHOTO_AGREEMENT;
  let i=0;
  (function next(){
    if(i>=EXTS.length){
      console.warn('Photo not found: '+base+' (tried '+EXTS.join(', ')+')');
      if(img.dataset.img==='agreement'&&img.classList.contains('agree'))img.style.display='none';
      img.removeAttribute('src');return;
    }
    const t=new Image(),url=encodeURI(base+'.'+EXTS[i++]);
    t.onload=()=>{img.src=url};
    t.onerror=next;
    t.src=url;
  })();
}
document.querySelectorAll('img[data-img]').forEach(loadPhoto);

show(1);
</script>
</body>
</html>
